name: OBSLabs

options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "15.2"

targets:
  OBSLabs:
    type: application
    platform: macOS
    deploymentTarget: "15.2"
    sources:
      - path: OBSLabs
      - path: libwl/src
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.OBSLabs
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMainStoryboardFile: Main
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/libwl/src/**"
      configs:
        Debug:
          XCConfig: Pods/Target Support Files/Pods-OBSLabs/Pods-OBSLabs.debug.xcconfig
        Release:
          XCConfig: Pods/Target Support Files/Pods-OBSLabs/Pods-OBSLabs.release.xcconfig
    dependencies:
      - sdk: AVFoundation.framework   # AVSampleBufferDisplayLayer（预览）
      - sdk: CoreMedia.framework      # CMSampleBuffer / CMVideoFormatDescription
      - sdk: CoreVideo.framework      # CVPixelBuffer（合成帧）
